<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a120d"/>
<meta name="description" content="Međasi Futsal Liga — offline prikaz."/>
<title>Offline – Međasi Futsal Liga</title>
<style>
:root{color-scheme:dark;--green:#39e889;--bg:#050b08;--panel:#0a140e;--muted:#9bb1a2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;min-height:100dvh}
body{
 display:grid;place-items:center;overflow-x:hidden;
 padding:max(24px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
 color:#eff9f2;background:
  radial-gradient(520px 360px at 50% 5%,rgba(57,232,137,.12),transparent 72%),
  radial-gradient(420px 300px at 0 100%,rgba(57,232,137,.055),transparent 68%),
  linear-gradient(155deg,#08110b 0%,#040806 65%,#070e0a 100%);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
 text-align:center
}
.offline-card{
 position:relative;isolation:isolate;width:min(100%,440px);overflow:hidden;
 padding:clamp(26px,7vw,42px) clamp(20px,6vw,36px);
 border:1px solid rgba(57,232,137,.22);border-radius:26px;
 background:linear-gradient(155deg,rgba(12,25,16,.99),rgba(5,11,7,.995));
 box-shadow:0 28px 90px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.04);
 animation:offline-enter .3s cubic-bezier(.2,.75,.25,1) both
}
.offline-card::before{
 content:"";position:absolute;z-index:-1;top:0;left:12%;right:12%;height:1px;
 background:linear-gradient(90deg,transparent,rgba(57,232,137,.75),transparent)
}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.brand-mark{
 display:grid;place-items:center;width:43px;height:43px;flex:0 0 43px;
 border:1px solid rgba(57,232,137,.4);border-radius:50%;
 background:radial-gradient(circle at 30% 20%,#284532,#0a130d 75%);
 box-shadow:0 0 26px rgba(57,232,137,.1),inset 0 1px 0 rgba(255,255,255,.08)
}
.brand-mark svg{width:27px;height:27px;fill:none;stroke:#b8f7ce;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.brand-name{text-align:left}
.brand-name strong{display:block;color:#f2fbf5;font-size:13px;font-weight:900;letter-spacing:-.025em}
.brand-name span{display:block;margin-top:3px;color:#82a58e;font-size:8px;font-weight:800;letter-spacing:.17em}
.status-icon{
 display:grid;place-items:center;width:76px;height:76px;margin:0 auto 22px;
 border:1px solid rgba(57,232,137,.25);border-radius:23px;
 background:linear-gradient(145deg,rgba(57,232,137,.12),rgba(57,232,137,.025));
 box-shadow:0 0 35px rgba(57,232,137,.065),inset 0 1px 0 rgba(255,255,255,.035)
}
.status-icon svg{width:36px;height:36px;fill:none;stroke:var(--green);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{margin:0 0 10px;color:#7fb492;font-size:9px;font-weight:900;letter-spacing:.19em}
h1{margin:0;color:#f2fbf5;font-size:clamp(24px,6vw,31px);font-weight:950;line-height:1.08;letter-spacing:-.05em}
p{max-width:320px;margin:14px auto 0;color:var(--muted);font-size:13px;line-height:1.7}
.retry{
 display:inline-flex;align-items:center;justify-content:center;gap:9px;
 min-height:48px;margin-top:25px;padding:0 22px;border:1px solid rgba(57,232,137,.42);border-radius:13px;
 background:linear-gradient(135deg,#70f2a6,#39d77e);color:#04130a;
 font:850 13px/1 inherit;cursor:pointer;
 box-shadow:0 9px 24px rgba(57,232,137,.12),inset 0 1px 0 rgba(255,255,255,.28);
 transition:transform .16s ease,box-shadow .16s ease,filter .16s ease
}
.retry:hover{transform:translateY(-1px);box-shadow:0 13px 30px rgba(57,232,137,.18);filter:saturate(1.05)}
.retry:active{transform:scale(.985)}
.retry:focus-visible{outline:2px solid #b7ffd0;outline-offset:4px}
.footnote{margin:22px 0 0;color:#6e8877;font-size:9px;letter-spacing:.04em}
@keyframes offline-enter{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:360px){.offline-card{border-radius:21px;padding:24px 18px}.brand{margin-bottom:22px}}
@media(prefers-reduced-motion:reduce){.offline-card{animation:none}.retry{transition:none}}
</style>
</head>
<body>
<main class="offline-card" aria-labelledby="offlineTitle">
  <div class="brand" aria-label="Međasi Futsal Liga">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 7 3 2v4l-3 2-3-2V9l3-2Z"/><path d="m9 9-3-1M15 9l3-1M9 13l-2 3M15 13l2 3M12 15v6"/></svg>
    </div>
    <div class="brand-name"><strong>Međasi Futsal Liga</strong><span>ZVANIČNA STRANICA LIGE</span></div>
  </div>
  <div class="status-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M3 8.5A14 14 0 0 1 21 8.5"/><path d="M6.5 12a8.5 8.5 0 0 1 11 0"/><path d="M10 15.5a3 3 0 0 1 4 0"/><path d="M12 20h.01"/><path d="m3 3 18 18"/></svg>
  </div>
  <div class="eyebrow">TRENUTNO NEMA VEZE</div>
  <h1 id="offlineTitle">Nema internet veze</h1>
  <p>Međasi Futsal Liga trenutno ne može učitati nove podatke. Provjeri internet vezu i pokušaj ponovo.</p>
  <button class="retry" type="button" onclick="location.reload()">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 1 1-2-4.9L20 12"/></svg>
    Pokušaj ponovo
  </button>
  <p class="footnote">Kad se veza vrati, osvježi stranicu za nove rezultate.</p>
</main>
</body>
</html>
