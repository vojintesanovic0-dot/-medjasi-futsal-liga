name: Backup main before and after changes

on:
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backup-before-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Create backup archive
        run: |
          git archive --format=tar.gz --output="backup-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}.tar.gz" HEAD
      - name: Create immutable backup tag
        run: |
          TAG="backup/pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup tag već postoji: $TAG"
          else
            git tag -a "$TAG" -m "Backup main prije PR #${{ github.event.pull_request.number }}" "${{ github.event.pull_request.base.sha }}"
            git push origin "$TAG"
          fi
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}
          path: backup-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}.tar.gz
          retention-days: 90

  backup-previous-main:
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout previous main state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 1
      - name: Create backup archive
        run: |
          git archive --format=tar.gz --output="backup-pre-main-${{ github.run_number }}-${{ github.event.before }}.tar.gz" HEAD
      - name: Create immutable backup tag
        run: |
          TAG="backup/pre-main-${{ github.run_number }}-${{ github.event.before }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup tag već postoji: $TAG"
          else
            git tag -a "$TAG" -m "Stanje main prije push-a" "${{ github.event.before }}"
            git push origin "$TAG"
          fi
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-pre-main-${{ github.run_number }}-${{ github.event.before }}
          path: backup-pre-main-${{ github.run_number }}-${{ github.event.before }}.tar.gz
          retention-days: 90