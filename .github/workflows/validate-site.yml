name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/fan-admin-action/index.ts supabase/functions/send-push/index.ts supabase/functions/delete-account/index.ts
      - name: Validate HTML assets, navigation, CSS, cache versions and JavaScript syntax
        run: node scripts/validate-site.mjs
      - name: Install browser smoke-test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise navigation and mobile controls in Chromium
        run: node scripts/smoke-test.mjs
