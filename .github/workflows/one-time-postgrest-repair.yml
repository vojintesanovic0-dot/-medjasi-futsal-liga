name: One-time PostgREST config repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-postgrest-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check whether the existing Management API credential is available
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No existing SUPABASE_ACCESS_TOKEN secret is configured. No Supabase changes were made."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "An existing secret is present. Its value will not be printed."

      - name: Read current PostgREST control-plane configuration
        if: steps.token.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: mesryrrjnsnhadoahbux
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             "https://api.supabase.com/v1/projects/${PROJECT_REF}/postgrest"             -o /tmp/postgrest-config.json
          echo "Current PostgREST configuration (schema names only):"
          jq '{db_schema, db_extra_search_path, db_pool, db_pool_acquisition_timeout}' /tmp/postgrest-config.json

      - name: Set only the existing public API schemas
        if: steps.token.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: mesryrrjnsnhadoahbux
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X PATCH             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data '{"db_schema":"public,graphql_public"}'             "https://api.supabase.com/v1/projects/${PROJECT_REF}/postgrest"             -o /tmp/postgrest-patch.json
          echo "Updated PostgREST configuration:"
          jq '{db_schema, db_extra_search_path, db_pool, db_pool_acquisition_timeout}' /tmp/postgrest-patch.json

      - name: Restart project to apply PostgREST control-plane config
        if: steps.token.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: mesryrrjnsnhadoahbux
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart"             -o /tmp/restart-response.json
          echo "Supabase accepted the project restart request."

      - name: Wait for real league REST endpoint to recover
        if: steps.token.outputs.available == 'true'
        env:
          SUPABASE_URL: https://mesryrrjnsnhadoahbux.supabase.co
          SUPABASE_KEY: sb_publishable_MVCdydxN-3CMuHpp8a5Nqg_aw5ZPDjH
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response_file=$(mktemp)
            status=$(curl --silent --show-error --max-time 10               -o "$response_file" -w "%{http_code}"               -X POST "${SUPABASE_URL}/rest/v1/rpc/get_league_snapshot"               -H "apikey: ${SUPABASE_KEY}"               -H "Authorization: Bearer ${SUPABASE_KEY}"               -H "Content-Type: application/json"               --data '{}' || true)
            if [ "$status" = "200" ]; then
              if jq -e '(.teams|type=="array") and (.players|type=="array") and (.matches|type=="array")' "$response_file" >/dev/null; then
                echo "PASS: REST API is back and the league snapshot has valid teams/players/matches arrays."
                jq '{teams:(.teams|length), players:(.players|length), matches:(.matches|length)}' "$response_file"
                rm -f "$response_file"
                exit 0
              fi
            fi
            echo "Recovery check ${attempt}/24: HTTP ${status:-unknown}; waiting before retry."
            if [ "$attempt" -eq 24 ]; then
              echo "REST API did not recover. Last response:"
              head -c 500 "$response_file" || true
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
            sleep 5
          done

      - name: Report if the credential was not configured
        if: steps.token.outputs.available != 'true'
        run: echo "No action taken; the repository has no SUPABASE_ACCESS_TOKEN secret."
