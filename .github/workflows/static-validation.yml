name: Static validation

on:
  push:
    branches: ["main", "ai-complete-repair-2026-10-08"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find js -type f -name "*.js" -print | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done


      - name: Validate local HTML assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          refs = re.findall(r"""(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']""", html, re.I)
          missing = []
          for ref in refs:
              if ref.startswith(("http://", "https://", "//")):
                  continue
              path = ref.split("?", 1)[0].removeprefix("./")
              if not os.path.isfile(path):
                  missing.append(ref)
          if missing:
              raise SystemExit("Missing local script/style assets: " + ", ".join(missing))
          print(f"Validated {len(refs)} local/remote script and stylesheet references.")
          PY

      - name: Validate SQL script order
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen=()
          for file in sql/[0-9][0-9]_*.sql; do
            test -f "$file" || continue
            prefix="${file##*/}"
            prefix="${prefix:0:2}"
            if [[ -n "${seen[$prefix]:-}" ]]; then
              echo "Duplicate SQL order prefix $prefix: ${seen[$prefix]} and $file"
              exit 1
            fi
            seen[$prefix]="$file"
          done

      - name: Setup Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/send-push/index.ts supabase/functions/fan-admin-action/index.ts

      - name: Validate required entry files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html manifest.json service-worker.js; do
            test -f "$file"
          done
