name: Temporary syntax check
on:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node check
        shell: bash
        run: |
          set -e
          for f in js/*.js service-worker.js; do
            echo "Checking $f"
            node --check "$f"
          done
