<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Medjaši Futsal Liga" />
  <title>Medjaši Futsal Liga</title>
  <link rel="stylesheet" href="./css/app.css?v=2026.10.1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="logo-home" onclick="showSection('home')">⚽ Medjaši</button>
      <nav>
        <button onclick="showSection('home')">Početna</button>
        <button onclick="showSection('matches')">Utakmice</button>
        <button onclick="showSection('table')">Tabela</button>
        <button onclick="showSection('teams')">Ekipe</button>
        <button onclick="showSection('players')">Igrači</button>
        <button onclick="showSection('gallery')">Galerija</button>
        <button onclick="showSection('community')">Community</button>
        <button onclick="showSection('chat')">Chat</button>
        <button onclick="showSection('news')">Vijesti</button>
      </nav>
      <div id="headerAccount"></div>
    </div>
  </header>

  <main>
    <section id="home" class="section active">
      <div class="card">
        <h1>Medjaši Futsal Liga</h1>
        <p>Rezultati, tabela, ekipe, igrači i live informacije.</p>
        <button onclick="showSection('matches')">Pogledaj utakmice</button>
      </div>
    </section>

    <section id="matches" class="section">
      <h2>Utakmice</h2>
      <div id="matchesList"></div>
    </section>

    <section id="table" class="section">
      <h2>Tabela</h2>
      <table>
        <thead>
          <tr><th>#</th><th>Ekipa</th><th>U</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <section id="teams" class="section">
      <h2>Ekipe</h2>
      <input id="teamSearch" oninput="renderTeams()" placeholder="Pretraži ekipe..." />
      <div id="teamsGrid"></div>
    </section>

    <section id="players" class="section">
      <h2>Igrači</h2>
      <input id="playerSearch" oninput="renderPlayers()" placeholder="Pretraži igrače..." />
      <div id="playersGrid"></div>
    </section>

    <section id="gallery" class="section">
      <h2>Galerija</h2>
      <div id="galleryGrid"></div>
    </section>

    <section id="community" class="section">
      <h2>Community</h2>
      <div id="communityFeed"></div>
    </section>

    <section id="chat" class="section">
      <h2>Chat</h2>
      <div id="chatBox"></div>
      <div id="chatForm" class="hidden">
        <input id="chatText" placeholder="Napiši poruku..." />
        <button onclick="sendChat()">Pošalji</button>
      </div>
    </section>

    <section id="news" class="section">
      <h2>Vijesti</h2>
      <div id="newsFeed"></div>
    </section>

    <section id="login" class="section">
      <h2>Prijava</h2>
      <div class="card">
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Lozinka" />
        <button onclick="login()">Prijavi se</button>
      </div>
      <div class="card">
        <h3>Registracija</h3>
        <input id="registerUsername" placeholder="Korisničko ime" />
        <input id="registerEmail" type="email" placeholder="Email" />
        <input id="registerPassword" type="password" placeholder="Lozinka" />
        <input id="registerPasswordConfirm" type="password" placeholder="Ponovi lozinku" />
        <button onclick="register()">Registruj se</button>
      </div>
    </section>

    <section id="admin" class="section" style="display:none;">
      <h2>Admin panel</h2>
      <div class="card">
        <h3>Dodaj ekipu</h3>
        <input id="teamName" placeholder="Naziv ekipe" />
        <input id="teamCoach" placeholder="Trener" />
        <button onclick="addTeam()">Dodaj ekipu</button>
      </div>
      <div class="card">
        <h3>Dodaj igrača</h3>
        <input id="playerName" placeholder="Ime igrača" />
        <input id="playerNumber" type="number" placeholder="Broj" />
        <select id="playerPosition">
          <option value="Krilo">Krilo</option>
          <option value="Bek">Bek</option>
          <option value="Pivot">Pivot</option>
          <option value="Golman">Golman</option>
        </select>
        <select id="playerTeam"></select>
        <button onclick="addPlayer()">Dodaj igrača</button>
      </div>
      <div class="card">
        <h3>Dodaj utakmicu</h3>
        <select id="matchHome"></select>
        <select id="matchAway"></select>
        <input id="matchDate" type="datetime-local" />
        <input id="matchRound" type="number" min="1" value="1" />
        <button onclick="addMatch()">Dodaj utakmicu</button>
      </div>
    </section>
  </main>

  <div id="toastWrap"></div>
  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" id="modalContent" onclick="event.stopPropagation()"></div>
  </div>

  <script src="./js/modules/core.js" defer></script>
  <script src="./js/modules/auth.js" defer></script>
  <script src="./js/modules/teams.js" defer></script>
  <script src="./js/modules/players.js" defer></script>
  <script src="./js/modules/matches.js" defer></script>
  <script src="./js/modules/chat.js" defer></script>
  <script src="./js/modules/gallery.js" defer></script>
  <script src="./js/modules/community.js" defer></script>
  <script src="./js/modules/news.js" defer></script>
  <script src="./js/modules/admin.js" defer></script>
  <script src="./js/modules/notifications.js" defer></script>
  <script src="./js/modules/realtime.js" defer></script>
  <script src="./js/index.js" defer></script>
</body>
</html>
